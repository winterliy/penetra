plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'xyz.wagyourtail.unimined'

    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = rootProject.java_version.toInteger()
        options.encoding = 'UTF-8'
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.java_version)
        }
    }

    unimined.minecraft(sourceSets.main, true) {
        version rootProject.minecraft_version
        mappings { mojmap() }
    }

    // Unimined adds Minecraft and its libraries to compiler task classpaths,
    // but not to Gradle's dependency model. Expose them so Java IDE importers
    // (including VS Code's Java language server) receive the same classpath.
    configurations.compileOnly.extendsFrom(configurations.minecraft, configurations.minecraftLibraries)
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "org.ow2.asm:asm:${asm_version}"
    // Java sources call Kotlin declarations, so expose Kotlin's output to
    // Java IDE classpath models as well as to Gradle's compileJava task.
    compileOnly files(layout.buildDirectory.dir('classes/kotlin/main'))
}

unimined.minecraft {
    runs.off = true
    defaultRemapJar = false
}
