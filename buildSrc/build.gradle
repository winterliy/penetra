repositories {
    mavenLocal()
    maven { url = 'https://maven.wagyourtail.xyz/releases' }
    maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/' }
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'commons-io:commons-io:2.7'
    implementation 'xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:1.4.2-SNAPSHOT'
    implementation 'xyz.wagyourtail.unimined.mapping:unimined-mapping-library-jvm:1.2.2'
}
